aid: flurry
name: Flurry
description: >-
  Flurry is a mobile app analytics platform originally built by Flurry, Inc. and
  acquired by Yahoo. It gave app developers event and session analytics, audience
  segmentation, funnels, journeys, crash and performance metrics, push messaging,
  and remote config across iOS, Android, Flutter, React Native, and Unity through
  client-side SDKs rather than a server REST API. The Flurry Analytics service
  sunset on 2024-03-15, but the official SDKs, developer portal, and legal/support
  resources remain published. Flurry was backed by Union Square Ventures and
  Version One Ventures and surfaced into the API Evangelist network from their
  portfolios.
